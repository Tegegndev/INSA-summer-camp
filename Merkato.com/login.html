<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Merkato</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .title {
            text-align: center;
            color:rgb(46, 168, 46);
        }
        .login-form {
            max-width: 200px;
            margin: 0 auto;
            padding: 20px;
            align-items: center;
        }

        .lognlinks{
            text-align: center;
            margin-top: 10px;
        }

    </style>
</head>
<body>
    
    <nav class="navbar">
        <h2 class="logo">Merkato.com</h2>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html">Products</a></li>
            
            <li><a href="cart.html">Cart</a></li>
            <li><a href="#" class="wishlist-link">&#9825; Wishlist</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
        <input id="search" class="search-bar" type="text" placeholder="Search">
        <button class="search-button">Search</button>
    </nav>




    <section>
        <h1 class="title">Login to Merkato</h1>
        <form  class="login-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>

            <button  class="btn">Login</button>
        </form>

        <div class="lognlinks">
        <p  style="cursor: pointer;color:blue"   onclick="alert('calm down and try to rememeber')">Forgot Password?</p>
        <p>Don't have an account?  <span style="color: blue;"> <a href="register.html">Register here</a>  </span>  </p>
        </div>
    </section>

</body>
</html>
