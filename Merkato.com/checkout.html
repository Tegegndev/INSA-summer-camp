<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
</head>
<body>
    
<nav>
        <h2>Merkato</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
        <input type="text" placeholder="Search">
        <button>Search</button>
    </nav>


    <section>
        <h1>Checkout</h1>

        <h2>Order Summary</h2>
        <table border="1" cellpadding="8">
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
            </tr>
            <tr>
                <td>HP PC</td>
                <td>45,000 BIRR</td>
                <td>1</td>
                <td>45,000 BIRR</td>
            </tr>
        </table>

        <p>
            <input type="text" id="coupon" name="coupon" placeholder="Enter coupon code">
            <button type="submit">Apply</button>
        </p>


        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required><br><br>

            <fieldset>
                <legend>Delivery Options:</legend>
                <input type="radio" id="delivery_standard" name="delivery" value="standard" checked>
                <label for="delivery_standard">Standard Delivery (3-5 days) - 100 BIRR</label><br>
                
                <input type="radio" id="delivery_express" name="delivery" value="express">
                <label for="delivery_express">Express Delivery (1-2 days) - 250 BIRR</label><br>

                <input type="radio" id="delivery_pickup" name="delivery" value="pickup">
                <label for="delivery_pickup">Store Pickup (Free)</label>
            </fieldset><br>

            <label for="payment">Payment Method:</label>
            <select id="payment" name="payment" required>
                <option value="">Select a payment method</option>
                <option value="telebirr">Telebirr</option>
                <option value="cbebirr">CBE Birr</option>
                <option value="bank-transfer">Bank Transfer</option>
            </select><br><br>

            <button type="submit">Place Order</button>
        </form>

</body>
</html>
