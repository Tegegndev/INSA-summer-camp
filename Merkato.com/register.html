<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Merkato</title>
</head>
<body>

    <nav>
        <h2>Merkato</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
        <input type="text" placeholder="Search">
        <button>Search</button>
    </nav>

    <section>
        <h1>Create an Account</h1>
        <p>Join Merkato and start shopping!</p>

        <form action="" method="POST">

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="e.g. Tegegn Wukianos" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="e.g. tegegn@gmail.com" required><br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="e.g. 0912345678" required><br><br>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Min 6 characters" required><br><br>

            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required><br><br>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              
            </select><br><br>

            <label>
                <input type="checkbox" name="terms" required>
                I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a>
            </label><br><br>

            <button type="submit">Register</button>
        </form>

        <p>Already have an account? <a href="login.html">Login here</a></p>
    </section>

    <footer>
        <ul>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Privacy Policy</a></li>
            <li><a href="#">Customer Support</a></li>
        </ul>
    </footer>

</body>
</html>
