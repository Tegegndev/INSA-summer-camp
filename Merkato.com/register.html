<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Merkato</title>
    <link rel="stylesheet" href="style.css">

    <style>
        h1, p {
            text-align: center;
        }

        .registerform {
            align-items: center;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }
           
    </style>
</head>
<body>

    <nav class="navbar">
        <h2 class="logo">Merkato.com</h2>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html">Products</a></li>
            
            <li><a href="cart.html">Cart</a></li>
            <li><a href="#" class="wishlist-link">&#9825; Wishlist</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
        <input id="search" class="search-bar" type="text" placeholder="Search">
        <button class="search-button">Search</button>
    </nav>

    <section>
        <h1>Create an Account</h1>
        <p>Join Merkato and start shopping!</p>

        <form  class="registerform" action="" method="POST">

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"  required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"  required><br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"  required><br><br>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username"  required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>

            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required><br><br>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              
            </select><br><br>

           <br><br>

            <button   class="btn" type="submit">Register</button>
        </form>

        <p>Already have an account? <a href="login.html">Login here</a></p>
    </section>

    <footer>
        <ul>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Privacy Policy</a></li>
            <li><a href="#">Customer Support</a></li>
        </ul>
    </footer>

</body>
</html>
