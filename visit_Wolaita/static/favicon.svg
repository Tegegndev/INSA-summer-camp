<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Radiant 24K Gold Gradient -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9a6" />
      <stop offset="30%" stop-color="#ffd400" />
      <stop offset="70%" stop-color="#f0b400" />
      <stop offset="100%" stop-color="#c98a00" />
    </linearGradient>

    <!-- Rich Imperial Crimson / Royal Maroon Gradient (Vibrant & Warm, NO BLACK) -->
    <radialGradient id="royalCrimson" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#b81414" />
      <stop offset="55%" stop-color="#8c0303" />
      <stop offset="100%" stop-color="#5e0000" />
    </radialGradient>

    <!-- Inner Glow for Crown & W -->
    <filter id="royalGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Circular Royal Medallion Background -->
  <circle cx="256" cy="256" r="240" fill="url(#royalCrimson)" stroke="url(#goldSheen)" stroke-width="16" />

  <!-- Inner Ornate Gold Ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldSheen)" stroke-width="3" stroke-dasharray="10,6" opacity="0.65" />

  <!-- ================= ROYAL KAWO CROWN ================= -->
  <g filter="url(#royalGlow)">
    <!-- Crown Cross / Sunburst Finial -->
    <path d="M 256 60 L 256 94 M 239 77 L 273 77" stroke="url(#goldSheen)" stroke-width="9" stroke-linecap="round" />
    <circle cx="256" cy="60" r="7" fill="#fff9a6" />

    <!-- Crown Diadem Arches -->
    <path d="M 174 168 C 174 104, 224 92, 256 92 C 288 92, 338 104, 338 168" fill="none" stroke="url(#goldSheen)" stroke-width="12" stroke-linecap="round" />
    <path d="M 212 168 C 212 122, 240 106, 256 106 C 272 106, 300 122, 300 168" fill="none" stroke="url(#goldSheen)" stroke-width="9" stroke-linecap="round" />
    <line x1="256" y1="92" x2="256" y2="168" stroke="url(#goldSheen)" stroke-width="9" />

    <!-- Velvet Cap interior behind arches -->
    <path d="M 190 168 C 190 125, 225 110, 256 110 C 287 110, 322 125, 322 168 Z" fill="#6e0000" opacity="0.7" />

    <!-- Crown Circlet Base -->
    <path d="M 158 174 C 206 190, 306 190, 354 174 C 358 186, 348 200, 318 205 C 278 211, 234 211, 194 205 C 164 200, 154 186, 158 174 Z" fill="url(#goldSheen)" stroke="#fff9a6" stroke-width="2" />

    <!-- Jewels on Circlet -->
    <circle cx="206" cy="192" r="6" fill="#fff" />
    <circle cx="256" cy="194" r="8" fill="#8b0000" stroke="#fff9a6" stroke-width="2" />
    <circle cx="306" cy="192" r="6" fill="#fff" />
  </g>

  <!-- ================= BOLD ROYAL "W" ================= -->
  <g filter="url(#royalGlow)">
    <!-- W Inner Fill (Warm Vermillion with Gold Accents) -->
    <polygon points="106,220 166,220 234,420 182,420" fill="#a81111" stroke="url(#goldSheen)" stroke-width="6" stroke-linejoin="round" />
    <polygon points="210,250 262,250 234,420 196,420" fill="#780000" stroke="url(#goldSheen)" stroke-width="5" stroke-linejoin="round" />
    <polygon points="250,250 302,250 316,420 278,420" fill="#780000" stroke="url(#goldSheen)" stroke-width="5" stroke-linejoin="round" />
    <polygon points="346,220 406,220 330,420 278,420" fill="#a81111" stroke="url(#goldSheen)" stroke-width="6" stroke-linejoin="round" />

    <!-- Dunguza Heritage Chevron Highlights -->
    <g stroke="#fff9a6" stroke-width="4" stroke-linecap="round">
      <line x1="126" y1="250" x2="152" y2="250" />
      <line x1="138" y1="290" x2="168" y2="290" />
      <line x1="150" y1="330" x2="184" y2="330" />
      <line x1="162" y1="370" x2="200" y2="370" />

      <line x1="360" y1="250" x2="386" y2="250" />
      <line x1="344" y1="290" x2="374" y2="290" />
      <line x1="328" y1="330" x2="362" y2="330" />
      <line x1="312" y1="370" x2="350" y2="370" />
    </g>

    <!-- Center Traditional Star / Diamond Motif -->
    <polygon points="256,428 268,444 256,460 244,444" fill="url(#goldSheen)" />
  </g>
</svg>
